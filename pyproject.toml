[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai"
version = "1.0.0"
description = "A local, planning, tool-using, self-critiquing LLM agent built on Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohit Sankhyan" }]
dependencies = [
  "ollama>=0.4",
  "pydantic>=2.6",
  "rich>=13",
  "chromadb>=0.5",
  "ddgs>=9",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
agentic-ai = "agentic_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
